services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/data/quality.db
      UPLOAD_DIR: /app/data/uploads
      MODEL_PATH: /app/artifacts/image_quality_model.joblib
      MAX_UPLOAD_MB: 10
      MAX_IMAGE_PIXELS: 40000000
    ports:
      - "8000:8000"
    volumes:
      - imageguard_data:/app/data
    restart: unless-stopped

volumes:
  imageguard_data:

